<html>
<body>
    <form>
        <!-- 수면 습관 설문조사 -->

        <!-- 이름 입력 -->
        <p>이름을 입력하세요.</p>
        <input type="text" name="name"><br>

        <!-- 학년 선택 -->
        <p>현재 몇 학년인가요?</p>
        <input type="radio" name="grade" value="1학년">1학년
        <input type="radio" name="grade" value="2학년">2학년
        <input type="radio" name="grade" value="3학년">3학년
        <input type="radio" name="grade" value="4학년">4학년<br>

        <!-- 하루 평균 수면 시간 -->
        <p>하루 평균 수면 시간은 얼마인가요?</p>
        <input type="radio" name="sleep" value="4시간 미만">4시간 미만
        <input type="radio" name="sleep" value="4~6시간">4~6시간
        <input type="radio" name="sleep" value="6~7시간">6~7시간
        <input type="radio" name="sleep" value="7~9시간">7~9시간
        <input type="radio" name="sleep" value="9시간 이상">9시간 이상<br>

        <!-- 수면 습관 체크 -->
        <p>수면 부족의 원인은 무엇인가요?</p>
        <input type="checkbox" name="cause" value="과제">과제 및 시험
        <input type="checkbox" name="cause" value="스마트폰">스마트폰 사용
        <input type="checkbox" name="cause" value="아르바이트">아르바이트
        <input type="checkbox" name="cause" value="스트레스">스트레스
        <input type="checkbox" name="cause" value="기타">기타<br>

        <!-- 의견 입력 -->
        <p>건강한 수면 습관을 위해 필요한 것은 무엇인가요?</p>
        <textarea name="opinion" rows="5" cols="40"></textarea><br>

        <!-- 버튼 -->
        <input type="submit" value="제출하기">
        <input type="reset" value="다시 작성하기">
    </form>
</body>
</html>
