<html>
<body>
    <form>
        <!-- 학년 선택 -->
        <p>현재 몇 학년인가요?</p>
        <select name="grade">
            <option>1학년</option>
            <option>2학년</option>
            <option>3학년</option>
            <option>4학년</option>
            <option>5학년 이상</option>
        </select>

        <br><br>

        <!-- 수면 시간 선택 -->
        <p>하루 평균 수면 시간은 얼마인가요?</p>
        <select name="sleep">
            <option>4시간 미만</option>
            <option>4시간 이상~6시간 미만</option>
            <option>6시간 이상~7시간 미만</option>
            <option>7시간 이상~9시간 미만</option>
            <option>9시간 이상</option>
        </select>

        <br><br>

        <!-- 취침 시간 선택 -->
        <p>평소 잠자리에 드는 시간은 언제인가요?</p>
        <select name="bedtime">
            <option>밤 10시 이전</option>
            <option>밤 10시~자정 이전</option>
            <option>자정~새벽 2시 이전</option>
            <option>새벽 2시~4시 이전</option>
            <option>새벽 4시 이후</option>
        </select>
    </form>
</body>
</html>
